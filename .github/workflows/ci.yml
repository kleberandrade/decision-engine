name: Dart CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.3.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test example validation
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/decision_engine_example.dart
      - run: dart run example/weighted_sum.dart
      - run: dart run example/custom_method.dart
      - run: dart compile js example/decision_engine_example.dart -o /tmp/decision-engine.js
      - run: node /tmp/decision-engine.js
      - run: dart pub publish --dry-run
        if: matrix.sdk == 'stable'

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validation/flutter_consumer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
