name: Dart CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.3.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test example validation
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/decision_engine_example.dart
      - run: dart run example/weighted_sum.dart
      - run: dart run example/custom_method.dart
      - run: dart run example/ahp.dart
      - run: dart run example/ahp_review.dart
      - run: dart compile js example/ahp_review.dart -o /tmp/decision-ahp-review.js
      - run: node /tmp/decision-ahp-review.js
      - run: dart run example/sensitivity.dart
      - run: dart compile js example/sensitivity.dart -o /tmp/decision-sensitivity.js
      - run: node /tmp/decision-sensitivity.js
      - run: dart compile js example/ahp.dart -o /tmp/decision-ahp.js
      - run: node /tmp/decision-ahp.js
      - run: dart compile js example/decision_engine_example.dart -o /tmp/decision-engine.js
      - run: node /tmp/decision-engine.js
      - run: dart pub publish --dry-run
        if: matrix.sdk == 'stable'

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validation/flutter_consumer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  flutter_lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/flutter_lab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn --base-href /decision-engine/
      - uses: actions/upload-artifact@v4
        with:
          name: decision-engine-lab-web
          path: example/flutter_lab/build/web

  pages:
    name: Publish decision laboratory
    needs: [verify, flutter, flutter_lab]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: decision-engine-lab-web
          path: public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
